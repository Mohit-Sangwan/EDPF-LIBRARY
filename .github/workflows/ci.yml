# EDPF commit gate (Appendix Z.13; Phase 01 CI skeleton — Phase 34 completes it).
# Budget: 15 minutes. A red main branch is a stop-the-line event.
#
# ─────────────────────────────────────────────────────────────────────────────
# 2026-08-03: this file referenced `Edpf.sln` in four places across two
# workflows. The solution is `Edpf.slnx` (SDK 10 format) and has been since
# Phase 01, so every `build-and-test` job would have died at `dotnet restore`.
# The repository has no git remote, so the pipeline had never executed and
# nothing reported the breakage.
#
# The commit gate was itself an unverified control — the fifth found in one
# session, after a field-level permission that was never read, a benchmark
# gate with no baseline, a provider-parity suite excluded by a filter, and a
# Tier 3 surface that only ever compiled.
#
# It is fixed here but STILL UNPROVEN: verifying a GitHub Actions workflow
# requires GitHub Actions. Treat the first push as the real test.
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, analyze, unit + architecture tests (all TFMs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning and versioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Edpf.slnx

      - name: Build (warnings as errors, all TFMs)
        run: dotnet build Edpf.slnx --no-restore --configuration Release

      - name: Unit tests + coverage
        run: >
          dotnet test tests/Edpf.UnitTests/Edpf.UnitTests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Architecture tests (Clean Architecture as executable rules)
        run: >
          dotnet test tests/Edpf.ArchitectureTests/Edpf.ArchitectureTests.csproj
          --no-build --configuration Release

      # The adversarial isolation suite runs on every commit and at every
      # gate, permanently (Phase 12 §④). It also fails if a phase adds a data
      # path without extending it.
      - name: Adversarial isolation suite
        run: >
          dotnet test tests/Edpf.IsolationTests/Edpf.IsolationTests.csproj
          --no-build --configuration Release

      - name: Walking-skeleton unit tests
        run: >
          dotnet test tests/Edpf.WalkingSkeleton.Tests/Edpf.WalkingSkeleton.Tests.csproj
          --no-build --configuration Release
          --filter "Category!=RequiresDocker"

      - name: Conformance tests
        run: >
          dotnet test tests/Edpf.ConformanceTests/Edpf.ConformanceTests.csproj
          --no-build --configuration Release

      # ★ Each framework is asked for BY NAME, and the reason is not the one
      # this comment used to give.
      #
      # It claimed `dotnet test` runs only one TFM of a multi-targeted project.
      # It does not — it cross-targets, and running the project plainly
      # produces a result line per framework. What actually happened is in
      # tests/Edpf.RuntimeTests: the singular <TargetFramework> inherited from
      # tests/Directory.Build.props silently defeated the plural
      # <TargetFrameworks>, so only ONE framework was ever BUILT. A missing
      # build output was misread as a limitation of the runner.
      #
      # Naming them is still worth doing, for a different reason: a framework
      # that cannot execute fails this step loudly, instead of quietly
      # producing one fewer result line among ten. That is the failure mode
      # this repository keeps rediscovering.
      #
      # The list is DERIVED, not written. Adding a framework to
      # EdpfLibraryTargetFrameworks enrolls it here automatically; a hand-kept
      # list is what went stale, and the consolidation audit's lesson is that a
      # rule which names its subjects goes stale while one that discovers them
      # does not.
      #
      # windows-latest is required: net472/net48 cannot execute elsewhere.
      - name: Tiered runtime suite (every declared framework)
        shell: bash
        run: |
          set -euo pipefail
          tfms=$(sed -n 's/.*<EdpfLibraryTargetFrameworks>\(.*\)<\/EdpfLibraryTargetFrameworks>.*/\1/p' Directory.Build.props)
          if [ -z "$tfms" ]; then
            echo "::error::Could not read EdpfLibraryTargetFrameworks from Directory.Build.props"
            exit 1
          fi
          echo "Declared library frameworks: $tfms"
          for tfm in ${tfms//;/ }; do
            echo "::group::Tiered runtime suite — $tfm"
            dotnet test tests/Edpf.RuntimeTests/Edpf.RuntimeTests.csproj \
              --no-build --configuration Release --framework "$tfm"
            echo "::endgroup::"
          done

      # `--disable-github-licenses` was removed in CycloneDX 6.x: GitHub
      # licence resolution is now OFF by default and opted INTO with
      # `--enable-github-licenses`. The stale flag aborted the step with
      # "Unrecognized command or argument" before it read a single project.
      #
      # Verified locally against CycloneDX 6.2.0: `.slnx` is accepted, and the
      # run produced a 243-package BOM with exit 0.
      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX Edpf.slnx -o artifacts/sbom
        shell: bash

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom

  integration:
    name: Integration tests (Tier A providers, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Integration tests — SQL Server + PostgreSQL
        run: >
          dotnet test tests/Edpf.WalkingSkeleton.Tests/Edpf.WalkingSkeleton.Tests.csproj
          --configuration Release
          --filter "Category=RequiresDocker"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
