# SAST on every commit (Z.19; Phase 01 exit criteria: SAST in CI from day one).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly deep scan

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended

      - name: Build
        run: dotnet build Edpf.sln --configuration Release

      - uses: github/codeql-action/analyze@v3
